name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  LC_ALL: C

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: false
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: bash scripts/verify-license.sh
      - run: go run scripts/verify-english-only.go
